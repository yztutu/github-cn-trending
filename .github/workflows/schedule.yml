name: schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and push
        run: |
          git config --local user.email "78296391+yztutu@users.noreply.github.com"
          git config --local user.name "yztutu"
          python3 generate.py fetch
          python3 generate.py build
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "中文热门日报 $(date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "no changes"
          fi
